<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23141824'/%3E%3Ccircle cx='50' cy='50' r='35' fill='none' stroke='%2300d5ff' stroke-width='4'/%3E%3Cpath d='M35 50 Q50 30 65 50' fill='none' stroke='%2300d5ff' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='60' r='6' fill='%2300d5ff'/%3E%3Cpath d='M50 48 L50 60' stroke='%2300d5ff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediDx — AI Clinical Decision Support System</title>
    <meta name="description" content="MediDx is a professional AI-powered telemedicine platform for clinical decision support. Manage patient encounters, generate differential diagnoses, and collaborate with clinicians seamlessly." />
    <meta name="keywords" content="telemedicine, clinical decision support, AI diagnostics, patient management, healthcare, medical" />
    <meta name="author" content="MediDx" />
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f1219">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      /* Critical CSS: prevent flash of unstyled content */
      body { 
        background-color: #0f1219; 
        margin: 0; 
        padding: 0; 
      }
      html[data-theme="ivory"] body {
        background-color: #f8f9fc;
      }
      html[data-theme="sunset"] body {
        background-color: #1a1410;
      }
      #root {
        min-height: 100vh;
      }
    </style>
    <script>
      // Apply saved theme BEFORE React renders to prevent flash
      (function() {
        var t = localStorage.getItem('medidx-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="error-container" style="color: #ff5757; padding: 20px; font-family: 'Inter', sans-serif; white-space: pre-wrap; background: #0f1219;"></div>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        document.getElementById('error-container').innerText += e.message + '\n';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.getElementById('error-container').innerText += e.reason + '\n';
      });
    </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
